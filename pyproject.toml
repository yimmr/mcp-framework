[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-core"
version = "0.7.0"
description = "Universal MCP Server Framework: Streamable HTTP ASGI, Cloudflare Tunnel, OAuth 2.1 & Process Supervisor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "yimmr" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
    "pywin32>=306; platform_system=='Windows'",
]

[project.urls]
Homepage = "https://github.com/yimmr/mcp-framework"
Repository = "https://github.com/yimmr/mcp-framework"
Documentation = "https://github.com/yimmr/mcp-framework#readme"

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]
tray = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.scripts]
mcp-server-core = "mcp_server_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
ignore = ["F541", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
